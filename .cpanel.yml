---
# cPanel Git Version Control deployment (docs/deployment.md).
#
# This runs on the server when somebody clicks "Deploy HEAD Commit". It is
# how the backend is installed on a host with no SSH: cPanel's deploy step
# is the only supported way to run a command there, and it is a reviewable
# file in the repository rather than something hidden in a panel.
#
# **This file is public.** The repository is public on GitHub, so nothing
# here may ever be a credential. Everything secret lives in backend/.env,
# which is gitignored and uploaded to the server separately.
#
# What it deliberately does NOT do:
#   - touch public_html. The Flutter web build is uploaded there directly;
#     it cannot be built on this host, and a deploy must never wipe a
#     working site because a Dart toolchain is missing.
#   - run anything at all before backend/.env exists. Migrations against an
#     unconfigured database would land in the wrong place, or nowhere.
deployment:
  tasks:
    - export HOME_DIR="$(cd ~ && pwd)"
    - export REPO="$HOME_DIR/edutrack"
    - export LOG="$HOME_DIR/edutrack-deploy.log"
    - export ENV_FILE="$REPO/backend/.env"

    - /bin/date "+== deploy %Y-%m-%d %H:%M:%S ==" > "$LOG"

    # The app's own python, not the system one. cPanel builds the virtualenv
    # under a version directory, so it is discovered rather than hardcoded -
    # a hardcoded 3.11 breaks silently the day the host offers 3.12.
    - export VENV_BIN="$(/bin/ls -d $HOME_DIR/virtualenv/edutrack/backend-python/*/bin 2>/dev/null | /usr/bin/head -1)"
    - echo "virtualenv: ${VENV_BIN:-NOT FOUND}" >> "$LOG"

    # Everything below is guarded on the two things that must exist first:
    # the Python app (created in Setup Python App) and the configuration.
    # Missing either, the deploy says so and stops rather than half-running.
    - if [ -z "$VENV_BIN" ]; then echo "STOP: no Python app yet - create it in Setup Python App with application root edutrack/backend-python" >> "$LOG"; exit 0; fi
    - if [ ! -f "$ENV_FILE" ]; then echo "STOP: backend/.env is missing - upload it before deploying" >> "$LOG"; exit 0; fi

    - echo "--- pip install ---" >> "$LOG"
    - cd "$REPO/backend-python" && "$VENV_BIN/pip" install --upgrade pip >> "$LOG" 2>&1
    - cd "$REPO/backend-python" && "$VENV_BIN/pip" install -r requirements.txt >> "$LOG" 2>&1

    # A dump before every migration that could touch existing rows, which is
    # the rollback. Skipped on the very first deploy, when there is nothing
    # to lose, and skipped quietly where pg_dump is not installed - a missing
    # backup tool must not stop a deploy, but it must be visible in the log.
    - echo "--- backup ---" >> "$LOG"
    - /bin/mkdir -p "$HOME_DIR/backups"
    - cd "$REPO/backend-python" && "$VENV_BIN/python" manage.py dump_before_migrate >> "$LOG" 2>&1 || echo "(no dump taken - see above)" >> "$LOG"

    - echo "--- migrate (schema is Laravel's) ---" >> "$LOG"
    - cd "$REPO/backend" && /usr/bin/php artisan migrate --force >> "$LOG" 2>&1

    # Safe to run again: an account that already exists is left untouched,
    # so a password its owner has since changed is never reset.
    - echo "--- super admin ---" >> "$LOG"
    - cd "$REPO/backend-python" && "$VENV_BIN/python" manage.py create_super_admin >> "$LOG" 2>&1

    # The two backends must agree about the schema they are both looking at.
    - echo "--- check_models ---" >> "$LOG"
    - cd "$REPO/backend-python" && "$VENV_BIN/python" manage.py check_models >> "$LOG" 2>&1

    # Passenger reloads when this is touched; without it the old code keeps
    # serving and the deploy looks like it did nothing.
    - echo "--- restart ---" >> "$LOG"
    - /bin/mkdir -p "$REPO/backend-python/tmp"
    - /usr/bin/touch "$REPO/backend-python/tmp/restart.txt"
    - echo "== done ==" >> "$LOG"
