{# A card per product page (school/module_pages.py), each a link to it. #}
<ul class="grid-3 modules">
  {% for module in modules %}
  <li><a class="card feature-card module-card {{ module.look.tone }}" href="{{ module.path }}"><span class="feature-icon">{{ module.look.icon }}</span><h3>{{ module.short_title }}</h3><p>{{ module.blurb }}</p><span class="more">Read more <span aria-hidden="true">&rarr;</span></span></a></li>
  {% endfor %}
</ul>
