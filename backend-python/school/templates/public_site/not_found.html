{% extends "public_site/base.html" %}
{% block content %}
<header class="page-head">
  <div class="wrap">
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p class="lead">There is no page at this address. It may have moved, or the link may be mistyped.</p>
    <div class="actions">
      <a class="button primary" href="/">Go to the homepage</a>
      <a class="button outline" href="{{ features_href }}">Explore features</a>
      <a class="button ghost" href="{{ login_href }}">Sign in</a>
    </div>
  </div>
</header>
{% endblock %}
