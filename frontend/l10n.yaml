# The phone apps' translations (docs/mobile-apps-review.md, M11).
# app_en.arb is the source of every string; app_hi.arb holds the Hindi.
# A further language is one more app_<code>.arb file.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# AppLocalizations.of() may be null - the web office has no delegate yet,
# nor do most widget tests; context.l10n falls back to English then.
nullable-getter: true
# Formatted as it is written, at the project's width (analysis_options.yaml):
# `flutter pub get` regenerates these files, and CI's format check runs after.
format: true
