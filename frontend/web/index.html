<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- The app, at /app/ (docs/seo.md, S2). The public pages search engines
       read are plain HTML at the site root; this is a signed-in tool, not a
       page anybody should land on from a search. -->
  <meta name="description" content="School365ai - sign in to your school.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D2140">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="School365ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon. The ?v= is raised whenever the icon changes (scripts/web_icon.py):
       the host lets browsers keep images for a week, and a new address is
       fetched fresh, so nobody is left looking at the old one. -->
  <link rel="icon" type="image/png" href="favicon.png?v=4"/>

  <title>School365ai</title>
  <link rel="manifest" href="manifest.json">

  <!--
    What a visitor sees while the app itself downloads: the School365ai mark,
    bouncing, the same as the app's own loader (lib/core/widgets/
    brand_loader.dart). Plain HTML and CSS, so it shows before a byte of the
    app has arrived; boot-loader.js takes it away on the app's first frame.
  -->
  <style>
    #boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; background: #F7F9FC; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #boot-loader .hop { display: flex; flex-direction: column; align-items: center; }
    #boot-loader .tile { width: 72px; height: 72px; border-radius: 18px; background: #fff; border: 1px solid #E2E9F0;
      display: grid; place-items: center; animation: boot-hop 1.2s ease-in-out infinite; }
    #boot-loader .tile img { height: 54px; width: auto; display: block; animation: boot-tilt 1.2s ease-in-out infinite; }
    #boot-loader .floor { width: 52px; height: 6px; margin-top: 8px; border-radius: 50%; background: rgba(13, 33, 64, .16);
      animation: boot-floor 1.2s ease-in-out infinite; }
    #boot-loader .name { font-size: 22px; font-weight: 800; color: #142A49; letter-spacing: -.02em; }
    #boot-loader .name .n { color: #087E79; }
    #boot-loader .name .ai { color: #5B1FA8; }
    @media (prefers-color-scheme: dark) { #boot-loader { background: #0A1628; } #boot-loader .name { color: #E8EEF6; } #boot-loader .name .n { color: #5FD3C8; } #boot-loader .name .ai { color: #B79CFF; } }
    @keyframes boot-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes boot-floor { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.7); opacity: .5; } }
    @keyframes boot-tilt { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(4deg); } 75% { transform: rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-loader * { animation: none !important; } }
  </style>
</head>
<body>
  <noscript>
    <!-- No script, so nothing would ever take the loading screen away. -->
    <style>#boot-loader { display: none; }</style>
    <p style="font-family: system-ui, sans-serif; padding: 24px;">School365ai needs JavaScript to run. <a href="/">Go to the homepage</a>.</p>
  </noscript>
  <div id="boot-loader" role="status" aria-label="Loading School365ai">
    <div class="hop">
      <div class="tile"><img src="icons/logo-mark.png" alt=""></div>
      <div class="floor"></div>
    </div>
    <div class="name">School<span class="n">365</span><span class="ai">AI</span></div>
  </div>
  <script src="boot-loader.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
