<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- What a search result and a shared link show (docs/seo.md, S1). The
       description is the snippet under the link; og:* and twitter:* draw the
       card on WhatsApp, LinkedIn, Facebook and X. og-image.png is drawn by
       scripts/og_image.py. -->
  <meta name="description" content="School365ai is school management software for attendance, fees, school bus tracking, timetables, payroll, parent SMS and WhatsApp alerts, and reports - on the web and on Android.">
  <link rel="canonical" href="https://school365ai.com/">
  <meta name="theme-color" content="#2563EB">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="School365ai">
  <meta property="og:url" content="https://school365ai.com/">
  <meta property="og:title" content="School365ai - School Management Software">
  <meta property="og:description" content="Attendance, fees, school bus tracking, timetables, payroll and parent alerts in one platform, on the web and on Android.">
  <meta property="og:image" content="https://school365ai.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="School365ai - school management software">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="School365ai - School Management Software">
  <meta name="twitter:description" content="Attendance, fees, school bus tracking, timetables, payroll and parent alerts in one platform.">
  <meta name="twitter:image" content="https://school365ai.com/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="School365ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon. The ?v= is raised whenever the icon changes (scripts/web_icon.py):
       the host lets browsers keep images for a week, and a new address is
       fetched fresh, so nobody is left looking at the old one. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>School365ai - School Management Software for Attendance, Fees and Transport</title>
  <link rel="manifest" href="manifest.json">

  <!--
    What a visitor sees while the app itself downloads: the School365ai mark,
    bouncing, the same as the app's own loader (lib/core/widgets/
    brand_loader.dart). Plain HTML and CSS, so it shows before a byte of the
    app has arrived; boot-loader.js takes it away on the app's first frame.
  -->
  <style>
    #boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #boot-loader .hop { display: flex; flex-direction: column; align-items: center; }
    #boot-loader .tile { width: 72px; height: 72px; border-radius: 19px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8); animation: boot-hop 1.2s ease-in-out infinite; }
    #boot-loader .tile svg { width: 100%; height: 100%; display: block; animation: boot-tilt 1.2s ease-in-out infinite; }
    #boot-loader .tassel { transform-origin: 78px 45px; animation: boot-swing 1.2s ease-in-out infinite; }
    #boot-loader .floor { width: 52px; height: 6px; margin-top: 8px; border-radius: 50%; background: rgba(29, 78, 216, .22);
      animation: boot-floor 1.2s ease-in-out infinite; }
    #boot-loader .name { font-size: 22px; font-weight: 800; color: #0F172A; }
    @keyframes boot-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes boot-floor { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.7); opacity: .5; } }
    @keyframes boot-tilt { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
    @keyframes boot-swing { 0%, 100% { transform: rotate(-26deg); } 50% { transform: rotate(26deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-loader * { animation: none !important; } }
  </style>
</head>
<body>
  <!--
    The homepage in plain words, for anyone whose browser does not run the
    app (docs/seo.md, S1). Only what the product really does; the full
    public site in plain HTML is phase S2.
  -->
  <noscript>
    <!-- No script, so nothing would ever take the loading screen away. -->
    <style>#boot-loader { display: none; }</style>
    <main style="max-width: 760px; margin: 0 auto; padding: 32px 16px; font-family: system-ui, sans-serif; color: #0F172A; line-height: 1.6;">
      <h1>School365ai - school management software</h1>
      <p>School365ai runs a school's day-to-day records in one place: students, staff, attendance, fees, timetables, school transport and messages to parents. Schools use it on the web, and their staff and bus crews on Android.</p>
      <h2>What it does</h2>
      <ul>
        <li><strong>Student and staff records</strong> - admissions, classes and sections, departments, subjects and staff profiles.</li>
        <li><strong>Attendance</strong> - class registers, staff attendance with biometric devices or check-in from the phone, and SMS or WhatsApp alerts to parents.</li>
        <li><strong>Fees</strong> - fee plans, receipts, reminders, discounts, late fines and credit balances, each school in its own currency.</li>
        <li><strong>School transport</strong> - routes and stops, live bus tracking, and boarding and drop-off records from the bus.</li>
        <li><strong>Academics</strong> - timetables, daily teaching reports, syllabus tracking, class tests and progress reports.</li>
        <li><strong>HR and payroll</strong> - staff leave, salaries and payslips.</li>
        <li><strong>Reports and analytics</strong> - attendance, fees, transport and academic trends for school leaders.</li>
      </ul>
      <p><a href="/about">About School365ai</a> &middot; <a href="/privacy">Privacy policy</a> &middot; <a href="/login">Sign in</a></p>
      <p>This page needs JavaScript to run the full app.</p>
    </main>
  </noscript>
  <div id="boot-loader" role="status" aria-label="Loading School365ai">
    <div class="hop">
      <div class="tile">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M30 50 L30 66 Q50 78 70 66 L70 50 Z" fill="#fff" fill-opacity=".82"/>
          <path d="M50 24 L86 41 L50 58 L14 41 Z" fill="#fff"/>
          <line x1="50" y1="41" x2="78" y2="45" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
          <g class="tassel">
            <line x1="78" y1="45" x2="78" y2="65" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="78" cy="65" r="4.5" fill="#FBBF24"/>
          </g>
          <circle cx="50" cy="41" r="3" fill="#FBBF24"/>
        </svg>
      </div>
      <div class="floor"></div>
    </div>
    <div class="name">School365ai</div>
  </div>
  <script src="boot-loader.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
