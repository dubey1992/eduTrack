org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_secure_storage 11 compiles against SDK 37; AGP 9.1 recommends at
# most 36 and refuses the build outright. The platform itself is installed
# (as android-37.0), so this says "build anyway" rather than holding the
# whole app back to an older credential store (docs/driver-app.md, D0).
android.suppressUnsupportedCompileSdk=37
