org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_secure_storage 11 compiles against SDK 37; AGP 9.1 recommends at
# most 36 and refuses the build outright. The platform itself is installed
# (as android-37.0), so this says "build anyway" rather than holding the
# whole app back to an older credential store (docs/driver-app.md, D0).

# google_navigation_flutter (Google's own, still beta) is built against
# android-35, while flutter_plugin_android_lifecycle's AAR metadata demands
# 36 of everything depending on it - so Google's navigation plugin cannot
# sit in the same build as Google's geolocation one. Neither is ours to fix,
# and the check being switched off is a *compile-time* one: minSdk, which
# decides which phones run the app, is untouched (docs/driver-app.md, D7).
android.experimental.disableCompileSdkChecks=true
